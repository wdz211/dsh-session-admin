name: CI
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax check
        run: |
          for f in $(find . -name '*.js' -o -name '*.mjs' | grep -v node_modules); do
            node --check "$f" || exit 1
          done
      - name: Unit tests (stubbed, no DSH host needed)
        run: |
          if [ -f test/selftest.mjs ]; then node test/selftest.mjs; else echo "no offline tests in this repo"; fi
